<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Octane element-scoped View Transitions</title>
		<style>
			section {
				width: 300px;
				min-height: 100px;
				padding: 12px;
				margin: 8px;
				background: #eee;
				border: 1px solid;
			}
			#inner {
				width: 240px;
			}
			.hero {
				view-transition-name: hero;
			}
			.card {
				view-transition-name: card;
			}
			::view-transition-group(*),
			::view-transition-old(*),
			::view-transition-new(*) {
				animation-duration: 10s;
			}
			#left::view-transition-new(*) {
				--scope-owner: left;
			}
			#right::view-transition-new(*) {
				--scope-owner: right;
			}
			#inner::view-transition-new(*) {
				--scope-owner: inner;
			}
			:root::view-transition-new(*) {
				--scope-owner: document;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
