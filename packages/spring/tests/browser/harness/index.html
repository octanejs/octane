<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Octane Spring browser harness</title>
		<style>
			body {
				margin: 0;
				font-family: sans-serif;
			}
			.react-spring-track {
				position: relative;
				width: 260px;
				height: 48px;
			}
			.react-spring-dot {
				position: absolute;
				width: 20px;
				height: 20px;
				background: currentcolor;
			}
			.react-spring-parallax {
				position: relative;
				width: 400px;
				height: 240px;
			}
			.react-spring-items {
				min-height: 24px;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.tsrx"></script>
	</body>
</html>
