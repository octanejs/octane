<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>@octanejs/grab browser harness</title>
		<style>
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
			}
			#app {
				display: grid;
				grid-template-columns: repeat(2, 160px);
				gap: 16px;
				padding: 40px;
			}
			.target {
				padding: 24px;
				border: 1px solid #ccc;
				border-radius: 8px;
				background: #f6f6f6;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div class="target" id="target-a" data-testid="target-a">Alpha card</div>
			<div class="target" id="target-b" data-testid="target-b">Beta card</div>
			<div class="target" id="target-c" data-testid="target-c">Gamma card</div>
			<button class="target" id="target-button" data-testid="target-button">Action</button>
		</div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
