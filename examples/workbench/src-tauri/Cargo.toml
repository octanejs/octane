[package]
name = "workbench"
version = "0.0.0"
description = "Workbench — an Octane + Tauri desktop task runner example"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
