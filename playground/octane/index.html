<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>octane playground</title>
	</head>
	<!-- style-nova scopes the shadcn semantic-hook styling and `dark` flips the
	     shared theme tokens; both live on <body> (not a subtree) because
	     dialog/menu portals mount into document.body. The playground chrome
	     (src/styles/playground.css) is built on the same tokens, so the whole
	     page follows the theme dynamically. -->
	<body class="style-nova dark">
		<!-- Apply the persisted theme before first paint (no flash). -->
		<script>
			try {
				const theme = localStorage.getItem('octane-playground-theme');
				if (theme) document.body.classList.toggle('dark', theme === 'dark');
			} catch {}
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
