allowBuilds:
  # The pinned react-hook-form suite uses its upstream SWC/Jest transform.
  '@swc/core': true
  esbuild: true
  playwright: true
  # Jest's resolver ships a native binary selected by its install script.
  unrs-resolver: true
  # Miniflare's local Cloudflare runtime binary; required by the adapter's
  # committed workerd integration test, with no project code generation.
  workerd: true
  # Miniflare can optionally transform image bindings through sharp. The
  # Cloudflare adapter runtime test exercises Workers/SSR only, so no native
  # sharp install step is needed.
  sharp: false
  # tldjs's postinstall is a no-op unless npm_config_tldjs_update_rules=true, and
  # it ships a bundled rules.json — so its build is not needed (pulled transitively
  # via rulesync). Explicitly declined to silence the ignored-builds warning.
  tldjs: false
  # Docusaurus pulls core-js transitively. Its postinstall only prints funding
  # information and is not required for the shipped polyfill modules.
  core-js: false
  # Optional native accelerators; both packages provide JavaScript fallbacks.
  '@parcel/watcher': false
  msgpackr-extract: false
  # LiveStore's test-only telemetry closure uses protobufjs; its postinstall
  # prints a donation notice and does not generate runtime artifacts.
  protobufjs: false
  # Wallet/WebSocket parity dependencies expose optional native accelerators;
  # Node and the packages themselves provide JavaScript fallbacks.
  bufferutil: false
  keccak: false
  utf-8-validate: false
  bun: true
  # Inferno's postinstall only prints OpenCollective funding information.
  inferno: false

# Variables
esrap_common: &esrap_common ^2.3.2

overrides:
  # Browser parity tooling and its transitive consumers must share one runner
  # and Chromium revision. Direct dependencies reference the same catalog.
  '@playwright/test': ^1.61.1
  playwright: ^1.61.1
  # esrap <2.3.2 printed `declare` on every bodyless function, corrupting the
  # virtual TSX for plain overload signatures (TS2384). See issue #736.
  esrap: ^2.3.2
  # Solid 2.0 SSR alignment: vite-plugin-solid@3.0.0-next.5 pulls an older
  # beta preset transitively. Keep the transform on the beta.20 line required
  # by @tsrx/solid so generated SSR helpers match the installed runtime.
  babel-preset-solid: '2.0.0-beta.20'
  babel-plugin-jsx-dom-expressions: '0.50.0-next.14'
  # INTERIM: @tanstack/devtools (the Solid UI core reused by
  # @octanejs/tanstack-devtools) targets Solid 1.x and imports `solid-js/web`,
  # which Solid 2.0-beta removed (web renderer moved to @solidjs/web). The
  # workspace otherwise pins Solid 2.0-beta for @tsrx/solid, so isolate the
  # devtools island — and every Solid package it shares an owner with — on a
  # single Solid 1.x copy. Remove once @tanstack/devtools ships a Solid-2 build.
  '@tanstack/devtools>solid-js': '1.9.14'
  '@tanstack/devtools-ui>solid-js': '1.9.14'
  '@tanstack/devtools-client>solid-js': '1.9.14'
  '@solid-primitives/event-listener>solid-js': '1.9.14'
  '@solid-primitives/keyboard>solid-js': '1.9.14'
  '@solid-primitives/resize-observer>solid-js': '1.9.14'

# Rspeedy exposes Rsbuild/Rspack-backed plugin state but does not declare
# @rspack/core itself. Make the audited Lynx instance explicit so a newer
# workspace-default Rspack cannot satisfy Rspeedy's private module lookup.
packageExtensions:
  '@lynx-js/rspeedy@0.16.0':
    peerDependencies:
      '@rspack/core': 2.1.3

catalogs:
  # Immer 11's published Iterator global conflicts with TypeScript's ESNext
  # libraries (immerjs/immer#1273), including 11.1.17. Keep Recharts' private
  # store on compatible RTK/Immer majors so packed consumers need no patches.
  recharts-store:
    '@reduxjs/toolkit': ~2.10.1
    immer: ^10.2.0
