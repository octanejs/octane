name: PR bench

# Measures every ready pull request against the main commit it would land on,
# on the SAME runner, and renders benchmarks/pr-report.mjs's Markdown report.
# That base is the merge commit's first parent, so every delta is this pull
# request's own; the pull request's recorded base can trail main by several
# merges, which the report states separately. Fork pull requests get a
# read-only token here, so this job only uploads the report; the trusted
# "PR bench comment" workflow posts it. Absolute numbers stay runner-specific:
# the report compares base and merge commit from this one run only.
#
# The job fails when a byte value exceeds its committed budget, when a
# js-framework work counter (production calls, DOM mutations) increases, or
# when a benchmark fails on the merge commit. Wall time is reported only, and
# so is the path-filtered lynx-render suite.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".changeset/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: benchmark report
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The merge commit and its parents: the first parent is the base.
          fetch-depth: 2

      - name: Check out base commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse HEAD^1)
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "BASE_TREE=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/pr-bench" >> "$GITHUB_ENV"
          drift=$(gh api "repos/$GITHUB_REPOSITORY/compare/$EVENT_BASE_SHA...$base" --jq .ahead_by || true)
          echo "BASE_DRIFT=$drift" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --prod false --frozen-lockfile
          pnpm --dir "$BASE_TREE" install --prod false --frozen-lockfile

      # The merge commit's harness drives both trees, so only its browser is needed.
      - name: Install Playwright Chromium
        run: pnpm --filter octane-js-framework-benchmarks exec playwright install --with-deps chromium

      # A failing suite is recorded in its result JSON and rendered in the
      # report, so both trees always run to completion before the verdict.
      # Byte suites are deterministic and run once per tree, both trees at once.
      - name: Benchmark bundle size
        id: bytes
        run: |
          mkdir -p "$RESULTS"
          (cd "$BASE_TREE" && node benchmarks/bench.mjs --results-dir="$RESULTS/base" bundle-size bundle-reachability) > "$RESULTS/base-bytes.log" 2>&1 &
          base=$!
          node benchmarks/bench.mjs --results-dir="$RESULTS/head" bundle-size bundle-reachability > "$RESULTS/head-bytes.log" 2>&1 &
          head=$!
          wait "$base" || echo "::warning::base bundle benchmarks failed"
          status=0
          wait "$head" || status=$?
          for side in base head; do
            echo "::group::$side bundle benchmarks"
            cat "$RESULTS/$side-bytes.log"
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One harness, the merge commit's, builds and serves both trees' fixtures
      # and drives them in one browser: exact work counters per operation, then
      # base and head samples alternating pair by pair (js-framework/pair.mjs).
      - name: Benchmark js-framework (paired)
        run: |
          node benchmarks/js-framework/pair.mjs --base-tree="$BASE_TREE" \
            --base-json="$RESULTS/base/js-framework.json" \
            --head-json="$RESULTS/head/js-framework.json" \
            || echo "::warning::paired js-framework benchmark failed; the report names the side"

      # Lynx dual-thread render cost is a report only, and it runs only when the
      # pull request touches the Lynx renderer, the universal runtime it builds
      # on, its compiler backend, or the harness. Its deterministic counters
      # (wire bytes, Element PAPI calls, renders, fixture bytes) are exact for a
      # build; its timings are unpaired. Base and head run one after the other.
      - name: Benchmark lynx-render (report only)
        run: |
          lynx_paths='^(packages/lynx/|packages/rspeedy-plugin-octane/|packages/octane/src/universal|packages/octane/src/compiler/(compile-universal|compile-lynx|universal-runtime|renderers)\.js$|benchmarks/lynx-render/)'
          if ! git diff --name-only HEAD^1 HEAD | grep -qE "$lynx_paths"; then
            echo "No Lynx render path changed; lynx-render is not reported."
            exit 0
          fi
          (cd "$BASE_TREE" && node benchmarks/bench.mjs --quick --results-dir="$RESULTS/base" lynx-render) \
            || echo "::warning::base lynx-render benchmark failed"
          node benchmarks/bench.mjs --quick --results-dir="$RESULTS/head" lynx-render \
            || echo "::warning::lynx-render benchmark failed; the report names it"

      # The report exits non-zero for a budget breach, an increased work
      # counter, or a benchmark that failed on the merge commit. Record that and
      # fail only after the report is uploaded for the comment workflow.
      - name: Render report
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RESULTS/report"
          status=0
          HEAD_SHA="$MERGE_SHA" node benchmarks/pr-report.mjs \
            --base="$RESULTS/base" --head="$RESULTS/head" \
            --out="$RESULTS/report/report.md" || status=$?
          printf '%s\n' "$PR_NUMBER" > "$RESULTS/report/pr-number"
          printf '%s\n' "$HEAD_SHA" > "$RESULTS/report/head-sha"
          cat "$RESULTS/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-bench-report
          path: |
            ${{ env.RESULTS }}/report/
            ${{ env.RESULTS }}/*/*.json
          retention-days: 14

      - name: Fail on a budget breach, added work, or a failed benchmark
        if: steps.bytes.outputs.status != '0' || steps.report.outputs.status != '0'
        run: exit 1
