      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install pinned repository dependencies
        id: install_lynx_dependencies
        run: pnpm install --frozen-lockfile

      # Each step is a separate Node process because Rspack and TASM load native
      # state. The script also gives each lane a distinct temporary external
      # consumer for its exact dependency graph and two clean native builds.
      - name: Pack and build Lynx minimum compatibility graph
        run: >-
          node packages/rspeedy-plugin-octane/scripts/compatibility-smoke.mjs
          --lane minimum

      # Preserve the matrix's fail-fast: false behavior so a minimum-lane
      # failure does not hide whether the current graph is compatible.
      - name: Pack and build Lynx current compatibility graph
        if: ${{ !cancelled() && steps.install_lynx_dependencies.outcome == 'success' }}
        run: >-
          node packages/rspeedy-plugin-octane/scripts/compatibility-smoke.mjs
          --lane current

      - name: Verify the repository lockfile stayed immutable
        run: git diff --exit-code -- pnpm-lock.yaml

  package:
    name: validate publishable packages
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The privileged publish workflow uses this network-free contract to
      # classify registry state before Changesets is allowed to publish.
      - name: Test npm release reconciliation
        run: pnpm release:preflight:test

      # Pack the live, discovered package set instead of a hand-maintained
      # allowlist. The validator checks the post-pnpm manifest and tar contents,
      # including exports/bin/types and workspace/catalog protocol replacement,
      # then installs packed core + binding tarballs into an isolated consumer
      # to prove singleton resolution and client/server raw-source compilation.
      - name: Pack and validate every publishable package
        run: pnpm packages:pack:check

  # This stable marker lets consecutive lightweight commits inherit the last
  # full suite transitively. A lightweight run reaches it only after the scope
  # classifier verifies that its base already had equivalent provenance.
  provenance:
    name: CI provenance
    needs: [release_change, test, lint, typecheck, examples, three_compat, lynx_compat, package]
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Verify reusable CI coverage
        env:
          FULL_CI: ${{ needs.release_change.outputs.full_ci }}
          RELEASE_CHANGE_RESULT: ${{ needs.release_change.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          THREE_COMPAT_RESULT: ${{ needs.three_compat.result }}
          LYNX_COMPAT_RESULT: ${{ needs.lynx_compat.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$RELEASE_CHANGE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TYPECHECK_RESULT" = success
          test "$EXAMPLES_RESULT" = success

          if [ "$FULL_CI" = false ]; then
            test "$THREE_COMPAT_RESULT" = skipped
            test "$LYNX_COMPAT_RESULT" = skipped
            test "$PACKAGE_RESULT" = skipped
          else
            test "$TYPECHECK_RESULT" = success
            test "$THREE_COMPAT_RESULT" = success
            test "$LYNX_COMPAT_RESULT" = success
            test "$PACKAGE_RESULT" = success
          fi
