        id: install_heavy_node_chromium
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' }}
        run: pnpm --filter website exec playwright install --with-deps chromium

      # Keep each former lane as a named step, and let independent suites run
      # after a sibling failure when their own prerequisites are still valid.
      - name: Run package-build integration tests
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' && steps.install_heavy_node_chromium.outcome == 'success' }}
        run: >-
          pnpm vitest run
          website-mcp/tests/built-handler.e2e.test.ts
          packages/rspeedy-plugin-octane/tests/packed-consumer.test.ts
          packages/rspeedy-plugin-octane/tests/demo.test.ts
          packages/rspeedy-plugin-octane/tests/browser/web-host.test.ts
          packages/rsbuild-plugin-octane/tests/rsbuild.integration.test.ts
          packages/vite-plugin-octane/tests/production.test.ts
          --maxWorkers=1

      - name: Run eval-corpus integration tests
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' }}
        run: >-
          pnpm vitest run
          packages/octane-evals/tests/user-app-corpus.test.ts
          --maxWorkers=1

      - name: Run runtime-loader integration tests
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' }}
        run: >-
          pnpm vitest run
          packages/octane/tests/register-hook.test.ts
          --maxWorkers=1

      - name: Run Bun compiler-preload integration test
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' && steps.setup_heavy_node_bun.outcome == 'success' }}
        env:
          BUN_BINARY: bun
        run: node --test packages/octane/tests/register-hook-bun.integration.test.mjs

      - name: Run OpenTUI native integration tests
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' && steps.setup_heavy_node_bun.outcome == 'success' }}
        run: pnpm --dir packages/opentui test:native

      - name: Run Astro integration tests
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' && steps.install_heavy_node_chromium.outcome == 'success' }}
        run: >-
          pnpm vitest run
          packages/astro/tests/astro.e2e.test.ts
          --maxWorkers=1

  heavy_integration:
    name: heavy integration (${{ matrix.lane }}${{ matrix.playwright_browser && format(' - {0}', matrix.playwright_browser) || '' }})
    needs: release_change
    # Run browser coverage once on the Node 24 CI execution target.
    # Node 22.22.2 remains the published package engine baseline.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    strategy:
      matrix:
        include:
          - lane: browser
            playwright_browser: chromium
            specs: discovered

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      - name: Install selected Playwright browser
        if: ${{ matrix.lane == 'browser' }}
        run: pnpm exec playwright install --with-deps ${{ matrix.playwright_browser }}

      - name: Run ${{ matrix.lane }} integration tests
        run: |
          SPECS="$(node scripts/discover-heavy-browser-specs.mjs)"
          pnpm vitest run ${SPECS} --maxWorkers=1

  lint_checks:
    name: lint checks
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The production-error catalog is append-only. Its check compares the
          # current tree with the PR base or previous main commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Two-layer sync check for the RuleSync-generated agent files. The root
      # `prepare` script already re-ran `rulesync generate || true` during
      # install, so if the committed files were stale they are now MODIFIED in
      # the working tree, and `git diff` is what actually catches that. The
      # explicit `rules:check` still matters for the case where prepare's
      # rulesync invocation failed silently (it is `|| true` by design).
      #
      # The diff is deliberately unfiltered. An enumerated path list silently
      # stops covering whatever RuleSync starts emitting next, which is exactly
      # how the skill and instruction outputs escaped it. `prepare` runs nothing
      # but rulesync, so a dirty tree here is a stale generated file.
      - name: Check AI rule files are in sync
        run: |
          pnpm rules:check
          git diff --exit-code

      # 0.x alpha: changesets must stay on the patch track. release/publish
      # already enforce this, but checking on PRs surfaces a stray major/minor
      # bump at review time instead of at release time.
      - name: Disallow major and minor bumps in changesets
        run: pnpm changeset:check

      - name: Validate CI workflow behavior
        run: pnpm ci:workflow:test

      # A committed test must execute and pass. Intentional framework
      # divergences are ordinary assertions; missing environment prerequisites
      # fail with setup instructions instead of silently turning CI green.
      - name: Disallow skipped and expected-failure tests
        run: pnpm test:markers:check

      # Packages ship their `src/` directly, so an ambient `declare module
      # '*.tsrx'` in one reaches consumers and turns THEIR .tsrx imports into
      # `any`. Benchmarks, playground apps, and test directories are unpublished
      # and stay allowed.
      - name: Disallow wildcard .tsrx declarations in published sources
        run: pnpm tsrx-decls:check

      # The type-only lowerings rewrite some constructs into a generated binding
      # plus references to it. A position no hoisting pass reaches keeps the
      # references and drops the declaration, so editors and tsrx-tsc report
      # TS2304 on source that compiles and runs correctly. Packages typechecked
      # through tsgo cannot catch this — tsgo does not read .tsrx at all.
      - name: Disallow undeclared generated names in the virtual TSX
        run: pnpm virtual-tsx:check

      # The root rule and every skill description load on EVERY agent session.
      # Path-scoped rules under .rulesync carry `globs` and load only when a
      # matching file is opened, so they are deliberately not budgeted.
      - name: Check always-loaded agent context is within budget
        run: pnpm context:budget:check

      # docs/parity-gaps.md audits executable expected-failure pins and should
      # remain at zero under the committed-test policy above.
      - name: Check parity-gap index is current
        run: pnpm parity:gaps:check

      # Keep metadata, generated coverage, public claims, and the parity
      # tooling itself covered on lightweight changes. Full lane execution
      # remains in the dedicated Node 24 job above.
      - name: Validate React parity metadata and public claims
        run: |
          pnpm react-parity:test
          pnpm react-parity:validate

      # Redact's issues, pull requests, and tests are mined at a pinned commit
      # into an authored contract ledger. This network-free gate validates its
      # dispositions/local evidence and keeps the generated report current.
      - name: Check Redact-derived adversarial contract ledger
        env:
          OCTANE_REDACT_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm redact-audit:check

      # Production error URLs are a public compatibility surface. Keep the
      # append-only catalog, generated client/server formatters, and literal
      # runtime call sites synchronized before a package can be built.
      - name: Check Octane production error catalog
        env:
          OCTANE_ERROR_CODES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm error-codes:check

      # Package discovery is shared by every package-wide repository check.
      # This generated inventory catches unreviewed package additions and stale
      # hard-coded package counts before they spread to docs and tooling.
      - name: Check package inventory is current
        run: pnpm packages:inventory:check

      # Header and directory search consume one compact browser-safe snapshot
      # assembled from the authored catalogs, package manifests, and statuses.
      - name: Check website ecosystem index is current
        run: pnpm website:ecosystem-data:check

      - name: Check binding parity-gap index is current
        run: pnpm binding-parity:gaps:check

      # @octanejs/cli ships a snapshot of the binding and error-code catalogs
      # because it runs against user projects, not this checkout. Regenerating
      # has to happen in the same change that edits a status.json or adds an
      # error code, or `octane bindings`/`octane explain` go stale on npm.
      - name: Check CLI data snapshot is current
        run: pnpm cli:data:check

      # The CLI page's file trees and the create-octane README describe what
      # `octane create` writes. The snapshot they are drawn from comes from
      # running the command, so adding a file to a template without regenerating
      # leaves both documents quietly describing the old project.
      - name: Check scaffold file manifest is current
        run: pnpm scaffold:manifest:check

      # docs/bindings-status.md is generated from the per-package status.json
      # blocks in the @octanejs/* binding packages. Changing a binding's scope
      # means updating its status.json and regenerating in the same change.
      - name: Check bindings-status table is current
        run: pnpm bindings:status:check

      - name: Check Lucide generated sources are current
        run: pnpm lucide:generate:check

      - name: Check Phosphor Icons generated sources are current
        run: pnpm phosphor-icons:generate:check

      # The shadcn registry is what the upstream CLI installs from, and it
      # embeds the sibling versions its components need. Regenerating happens at
      # `changeset:version` too, so this catches a source edit that never ran
      # the generator.
      - name: Check shadcn registry is current
        run: pnpm shadcn:registry:check

      # The publish build otherwise only runs at prepack, so a broken dist
      # (an entry point missing from the build, an unresolvable relative
      # import in dist/ or the verbatim-copied compiler/) would ship silently.
      # build.mjs ends with verify-dist.mjs: every emitted module's imports
      # must resolve and every publishConfig export must import in plain Node.
      - name: Build octane package and verify dist
        run: pnpm build

  typecheck_checks:
    name: typecheck checks
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Validate example catalog and orchestration
        run: pnpm examples:static:check

  # `lint` and `typecheck` are protected-branch contexts. GitHub leaves a
  # required context pending when every job with that name is skipped, so keep
  # these reporters cheap and let the real work above remain skipped on drafts.
  lint:
    name: lint
    needs: [release_change, lint_checks]
    if: ${{ always() && !cancelled() && github.event.action != 'closed' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Report lint status
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          IS_RELEASE_PR: ${{ needs.release_change.outputs.is_release_pr }}
          RELEASE_CHANGE_RESULT: ${{ needs.release_change.result }}
          LINT_CHECKS_RESULT: ${{ needs.lint_checks.result }}
        run: |
          if [ "$IS_DRAFT" = true ] || [ "$IS_RELEASE_PR" = true ]; then
            test "$LINT_CHECKS_RESULT" = skipped
          else
            test "$RELEASE_CHANGE_RESULT" = success
            test "$LINT_CHECKS_RESULT" = success
          fi

  typecheck:
    name: typecheck
    needs: [release_change, typecheck_checks]
    if: ${{ always() && !cancelled() && github.event.action != 'closed' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Report typecheck status
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          IS_RELEASE_PR: ${{ needs.release_change.outputs.is_release_pr }}
          FULL_CI: ${{ needs.release_change.outputs.full_ci }}
          RELEASE_CHANGE_RESULT: ${{ needs.release_change.result }}
          TYPECHECK_CHECKS_RESULT: ${{ needs.typecheck_checks.result }}
        run: |
          if [ "$IS_DRAFT" = true ] || [ "$IS_RELEASE_PR" = true ] || [ "$FULL_CI" = false ]; then
            test "$TYPECHECK_CHECKS_RESULT" = skipped
          else
            test "$RELEASE_CHANGE_RESULT" = success
            test "$TYPECHECK_CHECKS_RESULT" = success
          fi

  example_shard:
    name: example apps (${{ matrix.shard }})
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        # Keep every app internally serial while spreading complete app
        # lifecycles across runners. The planner weights declared journeys and
        # repeated execution modes, then assigns each app to exactly one shard.
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter hacker-news-example exec playwright install --with-deps chromium

      - name: Run example browser journeys
        run: pnpm examples:e2e -- --shard=${{ matrix.shard }}

  # Keep browser journeys behind their own stable aggregate check so the
  # protected `typecheck` context can finish as soon as typechecking does.
  # `always()` makes a failed shard produce a failed example check, not a skip.
  examples:
    name: examples
    needs: [release_change, example_shard]
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Verify all example shards passed
        env:
          FULL_CI: ${{ needs.release_change.outputs.full_ci }}
          EXAMPLE_SHARD_RESULT: ${{ needs.example_shard.result }}
        run: |
          if [ "$FULL_CI" = false ]; then
            test "$EXAMPLE_SHARD_RESULT" = skipped
          else
            test "$EXAMPLE_SHARD_RESULT" = success
          fi

  three_compat:
    name: Three compatibility
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Each lane rewrites one importer without changing the repository lockfile
    # after its frozen base install. Distinct worktrees keep manifests,
    # node_modules, and test artifacts isolated while sharing one runner and
    # pnpm's content-addressed store.
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Prepare isolated Three compatibility worktrees
        id: prepare_three_compat
        run: |
          THREE_MINIMUM_WORKSPACE="$RUNNER_TEMP/octane-three-compat-minimum-r156"
          THREE_CURRENT_WORKSPACE="$RUNNER_TEMP/octane-three-compat-current"
          git worktree add --detach "$THREE_MINIMUM_WORKSPACE" "$GITHUB_SHA"
          git worktree add --detach "$THREE_CURRENT_WORKSPACE" "$GITHUB_SHA"
          test "$(git -C "$THREE_MINIMUM_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$THREE_CURRENT_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$THREE_MINIMUM_WORKSPACE" rev-parse --git-dir)" != "$(git -C "$THREE_CURRENT_WORKSPACE" rev-parse --git-dir)"

      # Keep the r172 differential oracle immutable. Each lane replaces only
      # the Three runtime/type pair, then selects the Octane-owned compatibility
      # suite so current/minimum support cannot be faked by the pinned oracle.
      - name: Test Three compatibility (minimum r156)
        working-directory: ${{ runner.temp }}/octane-three-compat-minimum-r156
        env:
          THREE_VERSION_SPEC: 0.156.0
        run: |
          pnpm install --frozen-lockfile
          THREE_VERSION="$(pnpm view "three@$THREE_VERSION_SPEC" version)"
          THREE_RELEASE_LINE="${THREE_VERSION%.*}"
          pnpm --filter @octanejs/three add --save-dev --lockfile=false "three@$THREE_VERSION" "@types/three@${THREE_RELEASE_LINE}.x"
          RESOLVED_THREE_VERSION="$(node -e "process.stdout.write(require('./packages/three/node_modules/three/package.json').version)")"
          TYPES_VERSION="$(node -e "process.stdout.write(require('./packages/three/node_modules/@types/three/package.json').version)")"
          TYPES_RELEASE_LINE="${TYPES_VERSION%.*}"
          echo "three=$RESOLVED_THREE_VERSION @types/three=$TYPES_VERSION"
          test "$RESOLVED_THREE_VERSION" = "$THREE_VERSION"
          test "$THREE_RELEASE_LINE" = "$TYPES_RELEASE_LINE"
          pnpm exec tsgo --noEmit -p packages/three/tsconfig.json
          pnpm exec tsc --noEmit -p packages/three/typetests/tsconfig.json
          OCTANE_THREE_COMPAT_VERSION="$THREE_VERSION" pnpm --dir packages/three test:compat

      # Preserve the matrix's fail-fast: false behavior: a minimum-lane failure
      # must not hide whether the current release is compatible.
      - name: Test Three compatibility (current)
        if: ${{ !cancelled() && steps.prepare_three_compat.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/octane-three-compat-current
        env:
          THREE_VERSION_SPEC: latest
        run: |
          pnpm install --frozen-lockfile
          THREE_VERSION="$(pnpm view "three@$THREE_VERSION_SPEC" version)"
          THREE_RELEASE_LINE="${THREE_VERSION%.*}"
          pnpm --filter @octanejs/three add --save-dev --lockfile=false "three@$THREE_VERSION" "@types/three@${THREE_RELEASE_LINE}.x"
          RESOLVED_THREE_VERSION="$(node -e "process.stdout.write(require('./packages/three/node_modules/three/package.json').version)")"
          TYPES_VERSION="$(node -e "process.stdout.write(require('./packages/three/node_modules/@types/three/package.json').version)")"
          TYPES_RELEASE_LINE="${TYPES_VERSION%.*}"
          echo "three=$RESOLVED_THREE_VERSION @types/three=$TYPES_VERSION"
          test "$RESOLVED_THREE_VERSION" = "$THREE_VERSION"
          test "$THREE_RELEASE_LINE" = "$TYPES_RELEASE_LINE"
          pnpm exec tsgo --noEmit -p packages/three/tsconfig.json
          pnpm exec tsc --noEmit -p packages/three/typetests/tsconfig.json
          OCTANE_THREE_COMPAT_VERSION="$THREE_VERSION" pnpm --dir packages/three test:compat

  lynx_compat:
    name: Lynx compatibility
    needs: release_change
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
