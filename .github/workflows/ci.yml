name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]

concurrency:
  # A merged pull request changes github.ref to main on its closed event. Keep
  # pull request runs grouped by number so closing one cancels only its CI run,
  # while the merge's new main run proceeds in its own ref-based group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Named once: the sharded suite excludes these specs and website_e2e runs
  # them. Splitting the paths means a stale name could silently stop running
  # one, so website_e2e asserts every file exists before it starts.
  WEBSITE_DOCS_SPEC: website/tests/core-apis-docs.test.ts
  WEBSITE_E2E_SPEC: website/tests/ssr-hydration.e2e.test.ts
  WEBSITE_SSR_SPEC: website/tests/ssr-smoke.test.ts
  ASTRO_E2E_SPEC: packages/astro/tests/astro.e2e.test.ts

jobs:
  release_change:
    name: classify changeset release
    # GitHub still emits workflow events while a pull request is a draft. Keep
    # every expensive job behind this guard. The two tiny required-check
    # reporters below still run so branch protection does not remain pending.
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.classify.outputs.is_release }}
      is_release_pr: ${{ steps.classify.outputs.is_release_pr }}
      is_release_merge: ${{ steps.classify.outputs.is_release_merge }}
      full_ci: ${{ steps.verify_scope.outputs.full_ci }}

    steps:
      # Authenticate both a generated release PR event and the eventual main
      # merge from PR metadata, commit ancestry, authorship, and changed files.
      # Any missing or unexpected data falls back to normal CI.
      - name: Identify a generated Changesets release change
        id: classify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput("is_release", "false");
            core.setOutput("is_release_pr", "false");
            core.setOutput("is_release_merge", "false");

            try {
              const { owner, repo } = context.repo;
              const expectedPull = (pull) =>
                pull.title === "Version Packages" &&
                pull.user?.login === "github-actions[bot]" &&
                pull.base.ref === "main" &&
                pull.base.repo?.full_name === `${owner}/${repo}` &&
                pull.head.ref === "changeset-release/main" &&
                pull.head.repo?.full_name === `${owner}/${repo}`;

              let pull;
              let generatedSha;
              let expectedParentSha;
              let merged;
              let releaseKind;

              if (context.eventName === "pull_request") {
                const candidate = context.payload.pull_request;
                if (!candidate || !expectedPull(candidate)) {
                  return;
                }
                pull = candidate;
                generatedSha = candidate.head.sha;
                expectedParentSha = candidate.base.sha;
                releaseKind = "pr";
              } else if (context.eventName === "push") {
                const message = context.payload.head_commit?.message ?? "";
                const commits = context.payload.commits ?? [];
                if (
                  context.ref !== "refs/heads/main" ||
                  !message.startsWith("Version Packages") ||
                  commits.length !== 1
                ) {
                  return;
                }

                const { data: pulls } =
                  await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner,
                    repo,
                    commit_sha: context.sha,
                  });
                const matches = pulls.filter(
                  (candidate) =>
                    candidate.merged_at !== null &&
                    candidate.merge_commit_sha === context.sha &&
                    expectedPull(candidate),
                );
                if (matches.length !== 1) {
                  core.warning(
                    `Expected one generated Changesets PR for ${context.sha}; found ${matches.length}. Running the full CI suite.`,
                  );
                  return;
                }

                pull = matches[0];
                generatedSha = pull.head.sha;
                releaseKind = "merge";
              } else {
                return;
              }

              const releaseFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: pull.number,
                  per_page: 100,
                },
              );
              const unexpectedFiles = releaseFiles.filter((file) => {
                if (
                  file.status === "removed" &&
                  /^\.changeset\/[^/]+\.md$/.test(file.filename)
                ) {
                  return false;
                }
                if (file.status !== "added" && file.status !== "modified") {
                  return true;
                }
                return !(
                  file.filename.endsWith("/CHANGELOG.md") ||
                  file.filename.endsWith("/package.json") ||
                  file.filename === "docs/bindings-status.md" ||
                  file.filename === "docs/packages.md" ||
                  file.filename === "packages/octane/src/version.ts" ||
                  file.filename.startsWith("packages/shadcn/registry/") ||
                  file.filename === "packages/cli/src/data/octane-data.json" ||
                  file.filename ===
                    "packages/octane-evals/datasets/train/user-apps-v1/manifest.jsonl"
                );
              });

              if (releaseFiles.length === 0 || unexpectedFiles.length > 0) {
                const sample = unexpectedFiles
                  .slice(0, 5)
                  .map((file) => file.filename)
                  .join(", ");
                core.warning(
                  `Changesets PR #${pull.number} contains unexpected files${sample ? `: ${sample}` : ""}. Running the full CI suite.`,
                );
                return;
              }

              const { data: generated } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: generatedSha,
              });
              const expectedReleaseCommit =
                generated.commit.message === "Version Packages" &&
                generated.commit.author?.email ===
                  "41898282+github-actions[bot]@users.noreply.github.com" &&
                generated.commit.committer?.email ===
                  "41898282+github-actions[bot]@users.noreply.github.com";

              if (!expectedReleaseCommit) {
                core.warning(
                  `Changesets PR #${pull.number} does not have the expected generated commit. Running the full CI suite.`,
                );
                return;
              }

              if (releaseKind === "pr") {
                const basedOnCurrentMain =
                  generated.parents.length === 1 &&
                  generated.parents[0].sha === expectedParentSha;
                if (!basedOnCurrentMain) {
                  core.warning(
                    `Changesets PR #${pull.number} is not based directly on its current main base. Running the full CI suite.`,
                  );
                  return;
                }

                core.setOutput("is_release", "true");
                core.setOutput("is_release_pr", "true");
                core.notice(
                  `Authenticated generated Changesets PR #${pull.number}; skipping duplicate PR CI.`,
                );
                return;
              }

              ({ data: merged } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: context.sha,
              }));
              const sameTree =
                merged.commit.tree.sha === generated.commit.tree.sha;
              const sameParent =
                merged.parents.length === 1 &&
                generated.parents.length === 1 &&
                merged.parents[0].sha === generated.parents[0].sha;
              if (!sameTree || !sameParent) {
                core.warning(
                  `Changesets merge ${context.sha} does not match its generated PR commit. Running the full CI suite.`,
                );
                return;
              }

              const parentSha = merged.parents[0].sha;
              const { data: parentRuns } =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  branch: "main",
                  event: "push",
                  status: "completed",
                  head_sha: parentSha,
                  per_page: 10,
                });
              const requiredTestJobs = ["test (24)"];
              let parentPassedTests = false;

              for (const run of parentRuns.workflow_runs) {
                if (
                  run.head_sha !== parentSha ||
                  run.head_branch !== "main" ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.event !== "push" ||
                  typeof run.head_commit?.message !== "string" ||
                  run.head_commit.message.startsWith("Version Packages")
                ) {
                  continue;
                }

                const jobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, per_page: 100 },
                );
                const successfulJobs = new Set(
                  jobs
                    .filter((job) => job.conclusion === "success")
                    .map((job) => job.name),
                );
                if (requiredTestJobs.every((name) => successfulJobs.has(name))) {
                  parentPassedTests = true;
                  break;
                }
              }

              if (!parentPassedTests) {
                core.warning(
                  `The parent of Changesets merge ${context.sha} has no completed CI run with the full test suite passing. Running the full tests.`,
                );
                return;
              }

              core.setOutput("is_release", "true");
              core.setOutput("is_release_merge", "true");
            } catch (error) {
              core.warning(
                `Could not authenticate Changesets release ${context.sha}: ${error.message}. Running the full CI suite.`,
              );
            }

      - name: Checkout change history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Keep the cheap lint/static gate universal. Expensive matrices can be
      # omitted only when the committed classifier proves that every changed
      # file is documentation, metadata, or an isolated developer helper.
      - name: Classify the CI scope
        id: change_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/classify-ci-change.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      # A lightweight diff can inherit coverage only from a base commit that
      # actually completed every expensive lane. This prevents a quick metadata
      # push from cancelling an untested source push and then going green.
      - name: Verify full-suite provenance
        id: verify_scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_FULL_CI: ${{ steps.change_scope.outputs.full_ci }}
        with:
          script: |
            core.setOutput("full_ci", "true");
            if (process.env.CANDIDATE_FULL_CI !== "false") {
              return;
            }

            try {
              const { owner, repo } = context.repo;
              const baseSha = process.env.BASE_SHA;
              if (!baseSha || /^0+$/.test(baseSha)) {
                core.warning(
                  "The lightweight change has no comparable base commit. Running full CI.",
                );
                return;
              }

              const requiredFullJobs = [
                "website integration suite",
                "React parity checks",
                "typecheck",
                "validate publishable packages",
                "heavy integration (package builds, eval corpus, runtime loaders, Astro)",
                "heavy integration (browser - chromium)",
                ...["1/3", "2/3", "3/3"].map(
                  (shard) => `example apps (${shard})`,
                ),
                "Three compatibility",
                "Lynx compatibility",
                ...["1/4", "2/4", "3/4", "4/4"].map(
                  (shard) => `test shard (Node 24, ${shard})`,
                ),
              ];
              const { data: baseRuns } =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  branch: "main",
                  event: "push",
                  status: "completed",
                  head_sha: baseSha,
                  per_page: 10,
                });

              for (const run of baseRuns.workflow_runs) {
                if (
                  run.head_sha !== baseSha ||
                  run.head_branch !== "main" ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.event !== "push" ||
                  run.conclusion !== "success"
                ) {
                  continue;
                }

                const jobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, per_page: 100 },
                );
                const successfulJobs = new Set(
                  jobs
                    .filter((job) => job.conclusion === "success")
                    .map((job) => job.name),
                );
                const hasReusableProvenance =
                  successfulJobs.has("CI provenance");
                const completedFullSuite = requiredFullJobs.every((job) =>
                  successfulJobs.has(job),
                );
                if (hasReusableProvenance || completedFullSuite) {
                  core.setOutput("full_ci", "false");
                  core.notice(
                    `Skipping expensive CI for a lightweight change based on tested ${baseSha}.`,
                  );
                  return;
                }
              }

              core.notice(
                `Base ${baseSha} has no completed run with every expensive lane passing. Running full CI.`,
              );
            } catch (error) {
              core.warning(
                `Could not verify full-suite provenance: ${error.message}. Running full CI.`,
              );
            }

  test_shard:
    name: test shard (Node 24, ${{ matrix.shard }})
    needs: release_change
    # Each source change has already passed this matrix before Changesets
    # generates its metadata-only release commit. Keep the post-merge CI run
    # (publishing waits for it), but do not repeat the full suite once the merge
    # has been authenticated above.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    strategy:
      matrix:
        # Split the large Vitest suite across four Node 24 runners. The
        # published engine baseline remains Node 22.22.2, but duplicating the
        # ordinary suite is not required to enforce that package metadata.
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      # Real builds, packed consumers, browser suites, and the ordinary suite
      # all use the repository's Node 24 CI execution target.
      - name: Run tests
        # WEBSITE_DOCS_SPEC is excluded through the environment, not `--exclude`:
        # it lives in the `website-unit` project, and a project that declares its
        # own `exclude` makes Vitest ignore the CLI flag. The flag was here and
        # did nothing. See the `website-unit` project in vitest.config.js.
        env:
          OCTANE_EXCLUDE_WEBSITE_DOCS: "1"
        run: >-
          pnpm test
          --config vitest.ci-sharded.config.js
          --shard=${{ matrix.shard }}
          --exclude "$WEBSITE_E2E_SPEC"
          --exclude "$WEBSITE_SSR_SPEC"
          --exclude "website-mcp/tests/built-handler.e2e.test.ts"
          --exclude "packages/octane-evals/tests/user-app-corpus.test.ts"
          --exclude "packages/rspeedy-plugin-octane/tests/packed-consumer.test.ts"
          --exclude "packages/rspeedy-plugin-octane/tests/demo.test.ts"
          --exclude "packages/rspeedy-plugin-octane/tests/browser/**/*.test.ts"
          --exclude "packages/rsbuild-plugin-octane/tests/rsbuild.integration.test.ts"
          --exclude "packages/vite-plugin-octane/tests/production.test.ts"
          --exclude "packages/octane/tests/browser/**/*.test.ts"
          --exclude "packages/dexie/tests/browser/**/*.test.ts"
          --exclude "packages/input-otp/tests/browser/**/*"
          --exclude "packages/monaco-editor/tests/browser/**/*.test.ts"
          --exclude "packages/tiptap/tests/browser/**/*.test.ts"
          --exclude "packages/three/tests/browser/**/*.test.ts"
          --exclude "$ASTRO_E2E_SPEC"

  react_parity_shard:
    name: React parity shard (${{ matrix.shard }}/4)
    needs: release_change
    # The complete package suite is intentionally Node 24-only. Like the
    # general shards, an authenticated release or lightweight change inherits
    # the last successful full run through CI provenance.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Vitest hashes parity file paths across these workers. Non-Vitest
        # manifests remain whole and use the same generic shard coordinates.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      # Browser parity lanes launch Chromium through Playwright.
      # Keep this package-agnostic so adding a binding never patches the workflow.
      - name: Install Playwright Chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      # The manifest runner executes every required runtime and type lane. Each
      # runner's JSON report proves the exact identities without a separate
      # pre-execution Vitest collection pass. The aggregate below combines the
      # file shards before proving complete lane coverage.
      - name: Check React parity inventories and execute required lanes
        env:
          REACT_PARITY_VITEST_REPORT: ${{ runner.temp }}/react-parity-vitest/shard-${{ matrix.shard }}.json
        run: pnpm react-parity:check --shard ${{ matrix.shard }}/4

      - name: Upload React parity Vitest shard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-parity-vitest-${{ matrix.shard }}
          path: ${{ runner.temp }}/react-parity-vitest/shard-${{ matrix.shard }}.json
          retention-days: 1

  react_parity_checks:
    name: React parity checks
    needs: [release_change, react_parity_shard]
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Verify all React parity shards passed
        env:
          REACT_PARITY_SHARD_RESULT: ${{ needs.react_parity_shard.result }}
        run: test "$REACT_PARITY_SHARD_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download React parity Vitest shard reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: react-parity-vitest-*
          path: ${{ runner.temp }}/react-parity-vitest
          merge-multiple: true

      - name: Verify complete React parity Vitest coverage
        run: >-
          node scripts/react-parity/verify-vitest-shards.mjs
          --reports-directory "${{ runner.temp }}/react-parity-vitest"
          --expected-shards 4

  # Keep the Node 24 aggregate check name while the work happens in parallel
  # above. `always()` makes a failed shard produce a failed required check and
  # folds the dedicated integration suites into the same merge and publishing
  # gates. An authenticated release or lightweight-change skip must satisfy
  # every prerequisite.
  test:
    name: test (24)
    needs:
      [
        release_change,
        test_shard,
        react_parity_checks,
        website_e2e,
        heavy_integration,
        heavy_node_integration,
      ]
    # The release PR does not need this test context. The post-merge release run
    # does: publish.yml verifies this stable aggregate name before publishing.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release_pr != 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Verify all test suites passed
        env:
          FULL_CI: ${{ needs.release_change.outputs.full_ci }}
          IS_CHANGESET_RELEASE_MERGE: ${{ needs.release_change.outputs.is_release_merge }}
          SHARD_RESULT: ${{ needs.test_shard.result }}
          REACT_PARITY_RESULT: ${{ needs.react_parity_checks.result }}
          WEBSITE_E2E_RESULT: ${{ needs.website_e2e.result }}
          HEAVY_INTEGRATION_RESULT: ${{ needs.heavy_integration.result }}
          HEAVY_NODE_INTEGRATION_RESULT: ${{ needs.heavy_node_integration.result }}
        run: |
          if [ "$IS_CHANGESET_RELEASE_MERGE" = true ] || [ "$FULL_CI" = false ]; then
            test "$SHARD_RESULT" = skipped
            test "$REACT_PARITY_RESULT" = skipped
            test "$WEBSITE_E2E_RESULT" = skipped
            test "$HEAVY_INTEGRATION_RESULT" = skipped
            test "$HEAVY_NODE_INTEGRATION_RESULT" = skipped
          else
            test "$SHARD_RESULT" = success
            test "$REACT_PARITY_RESULT" = success
            test "$WEBSITE_E2E_RESULT" = success
            test "$HEAVY_INTEGRATION_RESULT" = success
            test "$HEAVY_NODE_INTEGRATION_RESULT" = success
          fi

  website_e2e:
    name: website integration suite
    needs: release_change
    # Same authenticated-release skip as the shards above: a metadata-only
    # Changesets merge has already passed this on its parent commit.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      # The sharded suite excludes these paths by name. If any one ever moves,
      # fail instead of silently losing its dedicated coverage.
      - name: Verify the excluded specs exist
        run: |
          test -f "$WEBSITE_DOCS_SPEC"
          test -f "$WEBSITE_SSR_SPEC"
          test -f "$WEBSITE_E2E_SPEC"

      - name: Run the website integration suite
        run: >-
          pnpm vitest run
          "$WEBSITE_DOCS_SPEC"
          "$WEBSITE_SSR_SPEC"
          "$WEBSITE_E2E_SPEC"
          --maxWorkers=1

  heavy_node_integration:
    name: heavy integration (package builds, eval corpus, runtime loaders, Astro)
    needs: release_change
    # These suites use one dependency graph on the Node 24 CI execution target.
    # Node 22.22.2 remains the published package engine baseline.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.release_change.outputs.is_release != 'true' && needs.release_change.outputs.full_ci != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        id: install_heavy_node_dependencies
        run: pnpm install --prod false --frozen-lockfile

      - name: Setup Bun
        id: setup_heavy_node_bun
        if: ${{ !cancelled() && steps.install_heavy_node_dependencies.outcome == 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
