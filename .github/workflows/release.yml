name: Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # The action force-updates one shared release branch. A newer main reconciliation
  # must supersede an older push or manual run so stale work cannot land last.
  cancel-in-progress: true

permissions: {}

jobs:
  release-pr:
    if: github.repository == 'octanejs/octane' && github.ref == 'refs/heads/main'
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    name: Release PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changeset bump types
        run: pnpm changeset:check

      # Prove the repository-owned release plan before making the GitHub API
      # boundary best-effort. A malformed changeset, generator regression, or
      # formatting failure remains a hard workflow failure during an API outage.
      - name: Validate generated release plan
        run: |
          pnpm changeset:version
          git diff --check
          pnpm format:check

      - name: Restore checkout after release validation
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git checkout --detach "$GITHUB_SHA"

      # Reconciliation retries should produce the same release commit instead of
      # force-pushing timestamp-only changes and retriggering pull request CI.
      - name: Set deterministic release commit date
        id: release_commit
        run: |
          release_commit_date=$(git show -s --format=%cI "$GITHUB_SHA")
          echo "date=$release_commit_date" >> "$GITHUB_OUTPUT"

      - name: Create or update release pull request
        id: release_pr_first
        continue-on-error: true
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          branch: main
          github-token: ${{ github.token }}
          version: pnpm changeset:version
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_DATE: ${{ steps.release_commit.outputs.date }}
          GIT_COMMITTER_DATE: ${{ steps.release_commit.outputs.date }}

      # A failed action leaves its generated changes and local release branch behind.
      # Restore the triggering commit so the retry can recreate that branch cleanly.
      - name: Restore checkout before release retry
        if: steps.release_pr_first.outcome == 'failure'
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git checkout --detach "$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/heads/changeset-release/${GITHUB_REF_NAME}"; then
            git branch --delete --force "changeset-release/${GITHUB_REF_NAME}"
          fi

      - name: Wait before retrying the GitHub API
        if: steps.release_pr_first.outcome == 'failure'
        run: sleep 15

      - name: Retry creating or updating the release pull request
        id: release_pr_retry
        if: steps.release_pr_first.outcome == 'failure'
        continue-on-error: true
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          branch: main
          github-token: ${{ github.token }}
          version: pnpm changeset:version
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_DATE: ${{ steps.release_commit.outputs.date }}
          GIT_COMMITTER_DATE: ${{ steps.release_commit.outputs.date }}

      # changesets/action does not expose its HTTP status. Probe the exact first
      # API call with the same token so only GitHub 5xx/network outages can defer
      # synchronization; permission and healthy-API failures stay red.
      - name: Check GitHub release API availability
        id: release_api
        if: >-
          steps.release_pr_first.outcome == 'failure' &&
          steps.release_pr_retry.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            core.setOutput("synchronized", "false");
            try {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:changeset-release/main`,
                base: "main",
                per_page: 1,
              });
              core.setOutput("degraded", "false");
              core.setOutput("status", "200");

              // Once a Version Packages PR has merged, changesets/action can
              // report "No commits between main and changeset-release/main".
              // Prove that this is an expected no-op from remote state instead
              // of inspecting the consumed changeset files.
              if (pulls.length === 0) {
                const [{ data: main }, { data: release }] = await Promise.all([
                  github.rest.repos.getCommit({ owner, repo, ref: "main" }),
                  github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: "changeset-release/main",
                  }),
                ]);
                if (main.commit.tree.sha === release.commit.tree.sha) {
                  core.setOutput("synchronized", "true");
                  core.notice(
                    "The release branch already matches main and no release pull request is open.",
                  );
                }
              }
            } catch (error) {
              const status = Number(error.status ?? error.response?.status ?? 0);
              const code = String(error.code ?? error.cause?.code ?? "unknown");
              const networkErrors = new Set([
                "ECONNRESET",
                "ETIMEDOUT",
                "EAI_AGAIN",
                "ENOTFOUND",
              ]);

              core.setOutput("status", status > 0 ? String(status) : code);
              if (status >= 500 || networkErrors.has(code)) {
                core.setOutput("degraded", "true");
                core.warning(
                  `GitHub release API is unavailable (${status || code}); deferring PR synchronization.`,
                );
                return;
              }
              throw error;
            }

      - name: Accept synchronized release branch
        if: >-
          steps.release_pr_first.outcome == 'failure' &&
          steps.release_pr_retry.outcome == 'failure' &&
          steps.release_api.outputs.synchronized == 'true'
        run: |
          echo "::notice title=Release PR already synchronized::The remote release branch matches main and no generated release pull request is open."
          {
            echo "### Release PR already synchronized"
            echo
            echo "Both synchronization attempts found no commits to propose. The remote release branch matches main and no generated release pull request is open."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Defer release pull request synchronization
        if: >-
          steps.release_pr_first.outcome == 'failure' &&
          steps.release_pr_retry.outcome == 'failure' &&
          steps.release_api.outputs.degraded == 'true'
        env:
          OCTANE_RELEASE_API_STATUS: ${{ steps.release_api.outputs.status }}
        run: |
          echo "::warning title=Release PR sync deferred::GitHub API returned $OCTANE_RELEASE_API_STATUS after both synchronization attempts. The next main push or a manual Release PR run will retry."
          {
            echo "### Release PR synchronization deferred"
            echo
            echo "The generated release plan and formatting passed, but both PR synchronization attempts failed during a verified GitHub API outage ($OCTANE_RELEASE_API_STATUS)."
            echo
            echo "The next push to main or a manual Release PR workflow run will retry."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail unexplained release pull request errors
        if: >-
          always() &&
          steps.release_pr_first.outcome == 'failure' &&
          steps.release_pr_retry.outcome == 'failure' &&
          steps.release_api.outputs.degraded != 'true' &&
          steps.release_api.outputs.synchronized != 'true'
        env:
          OCTANE_RELEASE_API_STATUS: ${{ steps.release_api.outputs.status }}
        run: |
          echo "::error title=Release PR sync failed::Both synchronization attempts failed while the GitHub API probe was healthy or returned a non-outage error (${OCTANE_RELEASE_API_STATUS:-unknown})."
          exit 1

      # GITHUB_TOKEN-created pull request workflows require manual approval, and
      # workflow_dispatch check suites are not linked to the pull request. Write
      # the two required GitHub Actions checks directly onto the authenticated
      # generated head commit instead.
      - name: Record lightweight release pull request checks
        if: >-
          always() &&
          (
            steps.release_pr_first.outcome == 'success' ||
            steps.release_pr_retry.outcome == 'success'
          )
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:changeset-release/main`,
              base: "main",
              per_page: 100,
            });
            const matches = pulls.filter(
              (pull) =>
                pull.title === "Version Packages" &&
                pull.user?.login === "github-actions[bot]" &&
                pull.base.ref === "main" &&
                pull.head.repo?.full_name === `${owner}/${repo}` &&
                pull.base.repo?.full_name === `${owner}/${repo}` &&
                pull.head.ref === "changeset-release/main",
            );

            if (matches.length === 0) {
              core.info("No generated Changesets release PR needs checks.");
              return;
            }
            if (matches.length !== 1) {
              throw new Error(
                `Expected one generated Changesets release PR; found ${matches.length}.`,
              );
            }

            const pull = matches[0];
            let generated;
            let lastObservedSnapshot = "not fetched";
            const snapshotAttempts = 8;
            const snapshotDelayMs = 2_000;

            // changesets/action force-pushes the release branch immediately
            // before this step. The pull request API can keep returning the
            // previous head commit after that push succeeds, so authenticate
            // the branch ref itself and retry only while that ref has not
            // converged on this workflow's main commit.
            for (let attempt = 1; attempt <= snapshotAttempts; attempt += 1) {
              const { data: releaseRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: "heads/changeset-release/main",
              });
              const { data: candidateCommit } =
                await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: releaseRef.object.sha,
                });
              const expectedReleaseCommit =
                releaseRef.object.type === "commit" &&
                candidateCommit.commit.message === "Version Packages" &&
                candidateCommit.commit.author?.email ===
                  "41898282+github-actions[bot]@users.noreply.github.com" &&
                candidateCommit.commit.committer?.email ===
                  "41898282+github-actions[bot]@users.noreply.github.com";
              const basedOnCurrentMain =
                candidateCommit.parents.length === 1 &&
                candidateCommit.parents[0].sha === context.sha;

              if (expectedReleaseCommit && basedOnCurrentMain) {
                generated = candidateCommit;
                break;
              }

              lastObservedSnapshot = [
                `head ${releaseRef.object.sha}`,
                `parent ${candidateCommit.parents[0]?.sha ?? "none"}`,
              ].join(", ");
              if (attempt < snapshotAttempts) {
                core.info(
                  `Changesets PR #${pull.number} has not converged on ${context.sha} (${lastObservedSnapshot}); retrying snapshot ${attempt + 1}/${snapshotAttempts}.`,
                );
                await new Promise((resolve) =>
                  setTimeout(resolve, snapshotDelayMs),
                );
              }
            }

            if (!generated) {
              throw new Error(
                `Changesets PR #${pull.number} is not the expected generated commit based directly on ${context.sha} after ${snapshotAttempts} snapshots; last observed ${lastObservedSnapshot}.`,
              );
            }

            const releaseFiles = await github.paginate(
              github.rest.repos.getCommit,
              {
                owner,
                repo,
                ref: generated.sha,
                per_page: 100,
              },
              (response) => response.data.files ?? [],
            );
            const unexpectedFiles = releaseFiles.filter((file) => {
              if (
                file.status === "removed" &&
                /^\.changeset\/[^/]+\.md$/.test(file.filename)
              ) {
                return false;
              }
              if (file.status !== "added" && file.status !== "modified") {
                return true;
              }
              return !(
                file.filename.endsWith("/CHANGELOG.md") ||
                file.filename.endsWith("/package.json") ||
                file.filename === "docs/bindings-status.md" ||
                file.filename === "docs/packages.md" ||
                file.filename === "packages/octane/src/version.ts" ||
                file.filename.startsWith("packages/shadcn/registry/") ||
                file.filename === "packages/cli/src/data/octane-data.json" ||
                file.filename ===
                  "packages/octane-evals/datasets/train/user-apps-v1/manifest.jsonl"
              );
            });
            if (releaseFiles.length === 0 || unexpectedFiles.length > 0) {
              const sample = unexpectedFiles
                .slice(0, 5)
                .map((file) => file.filename)
                .join(", ");
              throw new Error(
                `Changesets PR #${pull.number} contains unexpected files${sample ? `: ${sample}` : ""}.`,
              );
            }

            const detailsUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await Promise.all(
              ["lint", "typecheck"].map((name) =>
                github.rest.checks.create({
                  owner,
                  repo,
                  name,
                  head_sha: generated.sha,
                  status: "completed",
                  conclusion: "success",
                  details_url: detailsUrl,
                  output: {
                    title: "Authenticated generated Changesets release PR",
                    summary:
                      "This metadata-only release commit reuses the checks that passed before its changesets entered the release plan.",
                  },
                }),
              ),
            );
            core.notice(
              `Recorded lightweight lint and typecheck results for Changesets PR #${pull.number} at ${generated.sha}.`,
            );
