name: Publish

on:
  # Keep publishing in this file: npm's trusted-publisher identity includes the
  # exact workflow filename. CI remains unprivileged; this workflow only gains
  # write/OIDC permissions after the corresponding main-branch CI run finishes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Recovery path for any successful main CI run. The job below validates the
  # run and derives its SHA; callers cannot supply an arbitrary commit.
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run ID for the main SHA to reconcile
        required: true
        type: string

concurrency:
  group: npm-publish

permissions: {}

jobs:
  publish:
    name: Publish validated SHA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    # Keep this job on a GitHub-hosted runner: npm trusted publishing only
    # accepts OIDC tokens whose `runner_environment` is `github-hosted`, so
    # provenance (and therefore `changeset:publish`) fails on self-hosted
    # runners such as Blacksmith.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      CI_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}

    steps:
      # workflow_run's GITHUB_SHA is the current default-branch head, not the
      # triggering run's SHA. Resolve and validate the run before checkout so
      # the privileged job can only execute a release commit that passed CI.
      - name: Resolve validated SHA
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error(`Invalid CI run ID: ${process.env.CI_RUN_ID}`);
            }

            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId,
            });

            const expected = {
              event: "push",
              head_branch: "main",
              head_repository: `${owner}/${repo}`,
              path: ".github/workflows/ci.yml",
            };
            const actual = {
              event: run.event,
              head_branch: run.head_branch,
              head_repository: run.head_repository?.full_name,
              path: run.path,
            };

            for (const [field, value] of Object.entries(expected)) {
              if (actual[field] !== value) {
                throw new Error(
                  `CI run ${runId} has ${field}=${actual[field]}, expected ${value}`,
                );
              }
            }

            if (!/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error(`CI run ${runId} returned an invalid head SHA`);
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const successfulJobs = new Set(
              jobs
                .filter((job) => job.conclusion === "success")
                .map((job) => job.name),
            );

            // CI provenance verifies both accepted run shapes: either every
            // expensive lane passed, or a lightweight diff intentionally
            // skipped those lanes after inheriting tested base coverage.
            // Retain the old explicit set for manual recovery from successful
            // CI runs created before the provenance marker existed.
            if (!successfulJobs.has("CI provenance")) {
              const legacyRequiredJobs = [
                "examples",
                "lint",
                "Lynx compatibility (current)",
                "Lynx compatibility (minimum)",
                "Three compatibility (current)",
                "Three compatibility (minimum r156)",
                "typecheck",
                "validate publishable packages",
                "test (24)",
              ];
              const missingJobs = legacyRequiredJobs.filter(
                (job) => !successfulJobs.has(job),
              );
              if (missingJobs.length > 0) {
                throw new Error(
                  `CI run ${runId} lacks successful CI provenance or legacy jobs: ${missingJobs.join(", ")}`,
                );
              }
            }

            if (run.conclusion !== "success") {
              throw new Error(`CI run ${runId} concluded ${run.conclusion}, expected success`);
            }

            core.setOutput("sha", run.head_sha);
            core.info(`Reconciling validated SHA ${run.head_sha} from CI run ${runId}`);

      - name: Checkout validated SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          # Do not enable dependency caching in this privileged workflow.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disallow major and minor bumps in changesets
        run: pnpm changeset:check

      # Check the complete workspace before Changesets starts. npm publishing is
      # not atomic across packages, so discovering a new unbootstrapped package
      # inside `changeset publish` would otherwise repeat the partial release
      # that stranded the July 2026 versions.
      - name: Preflight npm release state
        id: npm_release
        run: pnpm release:preflight

      # changesets/action creates a version PR instead of running its publish
      # command whenever any pending changeset document exists. release.yml
      # already owns version PRs, so hide those documents in this ephemeral
      # checkout and force this action to perform only npm reconciliation.
      - name: Isolate pending changesets from npm reconciliation
        if: steps.npm_release.outputs.needs_publish == 'true'
        run: pnpm release:prepare-publish

      - name: Publish to npm
        id: changesets
        if: steps.npm_release.outputs.needs_publish == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # changesets/action pushes every package tag concurrently when it also
          # creates GitHub releases. Large releases can overwhelm GitHub's ref
          # transaction hook, so the reconciliation step below owns both.
          createGithubReleases: false
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # npm trusted publishing via OIDC (id-token: write) — no NPM_TOKEN.
          PNPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_PROVENANCE: true

      # Run even after a partial npm failure: published versions are immutable,
      # and this idempotent pass can finish their tags/releases before the next
      # recovery run. Missing tags move in one atomic push; releases are created
      # sequentially so GitHub never receives dozens of concurrent ref updates.
      - name: Reconcile GitHub tags and releases
        if: always() && steps.npm_release.outcome == 'success'
        run: pnpm release:reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
