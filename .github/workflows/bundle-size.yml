name: Bundle size

# Called by CI so the existing release and lightweight-change classification
# stays authoritative. This job reports separately from the runtime test shards
# and remains part of the CI run that must pass before publishing.
#
# It gates what each production bundle may contain (public-import reachability,
# app-root specialization, hydration-free clients), never how many bytes it
# has. Pull requests see byte changes in the PR bench report.
on:
  workflow_call:
    inputs:
      run-benchmarks:
        description: Build all bundle scenarios unless CI authenticated inherited coverage
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    name: bundle size checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        if: inputs.run-benchmarks
        run: pnpm install --prod=false --frozen-lockfile

      # Every public-import scenario executes and retains only what it imports,
      # and the compiled applications keep their specialized app root.
      - name: Verify bundle reachability and root specialization
        if: inputs.run-benchmarks
        run: |
          node benchmarks/bundle-size/run-minimal.mjs
          node benchmarks/bundle-size/run.mjs octane-tsrx octane-jsx

      - name: Verify client-only bundles retain no hydration code
        if: inputs.run-benchmarks
        run: node benchmarks/bundle-size/run-hydration-free.mjs
