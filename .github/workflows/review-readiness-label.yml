name: Review readiness label

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Review feedback signal]
    types: [completed]

concurrency:
  # A review-feedback completion reconciles every labelled pull request, so
  # serialize those global passes while keeping comment commands per PR.
  group: ${{ github.workflow }}-${{ github.event.issue.number || 'review-feedback' }}
  cancel-in-progress: false

jobs:
  update:
    name: update label
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'workflow_run'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      issues: read
      pull-requests: write

    steps:
      - name: Reconcile review readiness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const READY = "READY FOR REVIEW";
            const WITHDRAWN = "REVIEW WITHDRAWN";
            const { owner, repo } = context.repo;

            async function unresolvedReviewThreads(number) {
              const unresolved = [];
              let after = null;
              let hasNextPage;

              do {
                const result = await github.graphql(
                  `query ($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $after) {
                          nodes {
                            isResolved
                            comments(first: 1) {
                              nodes {
                                url
                              }
                            }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number, after },
                );
                const threads = result.repository.pullRequest?.reviewThreads;
                if (!threads) {
                  return [];
                }

                for (const thread of threads.nodes) {
                  const first = thread.comments.nodes[0];
                  if (!thread.isResolved && first) {
                    unresolved.push(first.url);
                  }
                }
                hasNextPage = threads.pageInfo.hasNextPage;
                after = threads.pageInfo.endCursor;
              } while (hasNextPage);

              return unresolved;
            }

            async function openReadyPulls() {
              const matches = [];
              let after = null;
              let hasNextPage;

              do {
                const result = await github.graphql(
                  `query ($owner: String!, $repo: String!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequests(first: 100, after: $after, states: OPEN) {
                        nodes {
                          number
                          labels(first: 100) { nodes { name } }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }`,
                  { owner, repo, after },
                );
                const pulls = result.repository.pullRequests;
                matches.push(
                  ...pulls.nodes
                    .filter((pull) =>
                      pull.labels.nodes.some((label) => label.name === READY),
                    )
                    .map((pull) => pull.number),
                );
                hasNextPage = pulls.pageInfo.hasNextPage;
                after = pulls.pageInfo.endCursor;
              } while (hasNextPage);

              return matches;
            }

            async function pullState(number) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number,
              });
              return {
                isOpen: pull.state === "open",
                hasLabel: pull.labels.some((label) => label.name === READY),
              };
            }

            async function removeReady(number) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: READY,
                });
                return true;
              } catch (error) {
                // GitHub documents 404 when the label no longer exists. That
                // is the desired end state if another actor won the race.
                if (error.status === 404) {
                  return false;
                }
                throw error;
              }
            }

            try {
              if (context.eventName === "workflow_run") {
                const numbers = await openReadyPulls();
                for (const number of numbers) {
                  const state = await pullState(number);
                  if (!state.isOpen || !state.hasLabel) {
                    continue;
                  }
                  const unresolved = await unresolvedReviewThreads(number);
                  if (unresolved.length === 0) {
                    continue;
                  }
                  const removed = await removeReady(number);
                  if (!removed) {
                    core.notice(`${READY} was already absent from #${number}.`);
                    continue;
                  }
                  core.notice(
                    `Removed ${READY} from #${number}: ${unresolved.length} unresolved review ` +
                      `thread${unresolved.length === 1 ? " remains" : "s remain"}. ` +
                      unresolved.join(", "),
                  );
                }
                return;
              }

              const number = context.payload.issue.number;
              // Commands are case-sensitive standalone lines, so they can be
              // accompanied by an explanation without matching ordinary prose.
              const commands = context.payload.comment.body
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line === READY || line === WITHDRAWN);
              const command = commands.at(-1);
              if (!command) {
                return;
              }

              // Refetch because another run may have changed the labels since
              // this event was queued.
              const state = await pullState(number);
              if (!state.isOpen) {
                return;
              }

              if (command === READY) {
                const unresolved = await unresolvedReviewThreads(number);
                if (unresolved.length > 0) {
                  if (state.hasLabel) {
                    await removeReady(number);
                  }
                  core.notice(
                    `Did not apply ${READY} to #${number}: ${unresolved.length} unresolved review ` +
                      `thread${unresolved.length === 1 ? " remains" : "s remain"}. ` +
                      unresolved.join(", "),
                  );
                  return;
                }
                if (!state.hasLabel) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: number,
                    labels: [READY],
                  });
                  core.notice(`Applied ${READY} to #${number}.`);
                  return;
                }
              } else if (state.hasLabel) {
                const removed = await removeReady(number);
                core.notice(
                  removed
                    ? `Removed ${READY} from #${number}.`
                    : `${READY} was already absent from #${number}.`,
                );
                return;
              }

              core.notice(
                `${READY} is already ${state.hasLabel ? "applied to" : "absent from"} #${number}.`,
              );
            } catch (error) {
              core.setFailed(
                `Could not reconcile ${READY}: ${error.message}`,
              );
            }
