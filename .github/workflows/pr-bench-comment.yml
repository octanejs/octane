name: PR bench comment

# Posts one sticky pull request comment combining the "PR bench" report with
# CI job durations measured against recent `main` runs. workflow_run executes
# this file from the default branch with a write token, so it only checks out
# the default branch's report scripts and never runs pull request code. Either
# workflow finishing rebuilds the whole comment from the latest data for the
# commit, so the second to finish posts both sections. The artifact is
# untrusted data: the pull request must still point at the run's head commit,
# and the report must carry the marker and fit GitHub's comment limit.

on:
  workflow_run:
    workflows: [PR bench, CI]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}

jobs:
  comment:
    name: post benchmark report
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Check out default-branch report scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            benchmarks/ci-timing.mjs
            benchmarks/pr-report.mjs
          sparse-checkout-cone-mode: false

      - name: Find runs for the commit
        id: runs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const trigger = context.payload.workflow_run;
            // A newer in-progress, cancelled, or failed rerun must not hide a completed success.
            const completed = async (workflow_id) => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                head_sha: sha,
                event: "pull_request",
                status: "completed",
                per_page: 100,
              });
              const runs = data.workflow_runs.filter((run) => run.conclusion !== "cancelled");
              if (trigger.path.endsWith(`/${workflow_id}`) && !runs.some((run) => run.id === trigger.id)) {
                runs.push(trigger);
              }
              runs.sort((a, b) => b.id - a.id);
              return runs.find((run) => run.conclusion === "success") ?? runs[0];
            };
            const bench = await completed("pr-bench.yml");
            const ci = await completed("ci.yml");
            core.setOutput("bench", bench ? String(bench.id) : "");
            core.setOutput("ci", ci ? String(ci.id) : "");

      - name: Download benchmark report
        id: download
        if: steps.runs.outputs.bench != ''
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pr-bench-report
          path: ${{ runner.temp }}/pr-bench
          run-id: ${{ steps.runs.outputs.bench }}
          github-token: ${{ github.token }}

      - name: Post or update sticky comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPORT_DIR: ${{ runner.temp }}/pr-bench/report
          BENCH_DOWNLOADED: ${{ steps.download.outcome == 'success' }}
          CI_RUN: ${{ steps.runs.outputs.ci }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const load = (file) =>
              import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, file)).href);
            const timing = await load("benchmarks/ci-timing.mjs");
            const { COMMENT_MARKER } = await load("benchmarks/pr-report.mjs");
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const pull = pulls.find((candidate) => candidate.head.sha === sha);
            if (!pull) {
              core.notice(`No open pull request points at ${sha}; skipping a stale report.`);
              return;
            }

            let bench = null;
            if (process.env.BENCH_DOWNLOADED === "true") {
              const read = (name) => fs.readFileSync(path.join(process.env.REPORT_DIR, name), "utf8");
              const body = read("report.md");
              if (
                Number(read("pr-number").trim()) !== pull.number ||
                read("head-sha").trim() !== sha ||
                !timing.isBenchReport(body)
              ) {
                core.setFailed("Report artifact is not a benchmark report for this pull request.");
                return;
              }
              bench = body;
            }

            const jobsOf = (run_id) =>
              github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id,
                filter: "latest",
                per_page: 100,
              });
            let ciTiming = null;
            if (process.env.CI_RUN) {
              const run_id = Number(process.env.CI_RUN);
              const jobs = await jobsOf(run_id);
              if (timing.ranGatedJobs(jobs)) {
                const { data: ciRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
                const { data: mainRuns } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  branch: pull.base.ref,
                  event: "push",
                  status: "success",
                  per_page: 4 * timing.BASELINE_RUNS,
                });
                const summaries = [];
                for (const run of mainRuns.workflow_runs) {
                  summaries.push(timing.summarizeJobs(await jobsOf(run.id)));
                }
                const baselines = timing.selectBaselines(summaries);
                if (baselines.length) {
                  ciTiming = timing.renderCiTiming({
                    head: timing.summarizeJobs(jobs),
                    baselines,
                    headSha: sha,
                    runUrl: ciRun.html_url,
                    conclusion: ciRun.conclusion,
                  });
                }
              }
            }
            if (!bench && !ciTiming) {
              core.notice("Neither a benchmark report nor a timed CI run exists for this commit yet.");
              return;
            }
            const body = timing.composeComment({ bench, ciTiming });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.startsWith(COMMENT_MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
